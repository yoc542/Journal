name: Build MAUI Windows Desktop App

on:
  push:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install .NET MAUI Workload
        run: dotnet workload install maui

      - name: Check workloads
        run: dotnet workload list

      - name: Restore NuGet Packages
        run: dotnet restore JournalApp/JournalApp.csproj

      - name: Compile Unpackaged Windows Desktop App
        run: |
          dotnet publish JournalApp/JournalApp.csproj `
            -f net10.0-windows10.0.19041.0 `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:WindowsPackageType=None

      - name: Upload Windows Standalone App
        uses: actions/upload-artifact@v4
        with:
          name: journal-app-standalone
          path: JournalApp/bin/Release/net10.0-windows10.0.19041.0/win-x64/publish/
          retention-days: 7
